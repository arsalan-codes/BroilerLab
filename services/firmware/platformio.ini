; BroilerLab ESP32 firmware — PlatformIO project
; Board: ESP32-WROOM-32 (or ESP32-S3)
; Framework: Espressif ESP-IDF / Arduino (Arduino for faster bring-up)

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; Build flags
build_flags =
    -D CORE_DEBUG_LEVEL=3
    -D WROVER_K CONFIG_ESP32_SPIRAM_SUPPORT=y
    -D MQTT_MAX_PACKET_SIZE=1024
    -D MQTT_KEEPALIVE=60

; Lib deps
lib_deps =
    knolleary/PubSubClient @ ^2.8
    bogde/NewPing @ ^1.0.0
    adafruit/Adafruit NAU7802 @ ^1.3.0
    miguelbalboa/rfid @ ^1.4.10
    robtillaart/DS3231 @ ^1.2.1
    arduino-libraries/SD @ ^1.2.4
    feilipu/FreeRTOS @ ^10.5.1-3

; Optional: SPIFFS/LittleFS for offline queue
; (Arduino ESP32 has LittleFS built-in since core 2.x)
