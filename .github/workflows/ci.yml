name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    name: Backend (NestJS + PG)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: broiler
          POSTGRES_PASSWORD: broiler_dev
          POSTGRES_DB: broilerlab_ng
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/backend/package-lock.json
      - name: Install
        working-directory: services/backend
        run: npm ci
      - name: Build
        working-directory: services/backend
        run: npm run build
      - name: Unit tests (engine, vitest)
        working-directory: services/backend
        run: npm test
      - name: E2E tests (health, vitest)
        working-directory: services/backend
        run: npm run test:e2e
      - name: Migrate
        working-directory: services/backend
        env:
          DATABASE_URL: postgres://broiler:broiler_dev@localhost:5433/broilerlab_ng?sslmode=disable
        run: |
          npx dbmate up || true
      - name: Start backend & smoke test
        working-directory: services/backend
        env:
          DATABASE_URL: postgres://broiler:broiler_dev@localhost:5433/broilerlab_ng?sslmode=disable
          JWT_ACCESS_SECRET: test_access
          JWT_REFRESH_SECRET: test_refresh
          MQTT_URL: ""
          PORT: 3001
        run: |
          node dist/main.js &
          sleep 5
          curl -sf http://127.0.0.1:3001/api/v1/auth/login \
            -H "Content-Type: application/json" \
            -d '{"email":"researcher@lab.local","password":"broilerlab123"}' | grep access_token || exit 1

  frontend:
    name: Frontend (React+Vite+TS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/frontend/package-lock.json
      - name: Install
        working-directory: services/frontend
        run: npm ci
      - name: TypeScript check
        working-directory: services/frontend
        run: npx tsc -p tsconfig.app.json --noEmit
      - name: Build
        working-directory: services/frontend
        run: npx vite build --outDir dist
      - name: Unit tests (vitest)
        working-directory: services/frontend
        run: npx vitest run src/engine/engine.test.ts

  firmware:
    name: Firmware (PlatformIO build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PlatformIO
        run: pip install -U platformio
      - name: Validate firmware files
        working-directory: services/firmware
        run: |
          test -f platformio.ini || exit 1
          test -f src/main.cpp || exit 1
          test -f src/config.cpp || exit 1
          test -f include/config.h || exit 1
          echo "firmware files OK"
      - name: Build ESP32 firmware
        working-directory: services/firmware
        run: pio run -e esp32dev
